[package]
name = "fns-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "fns_cli"
path = "src/lib.rs"

[[bin]]
name = "fns-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
notify = "8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
url = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
filetime = "0.2"
walkdir = "2"
